<main class="hero"><div class="shell"><h1 class="brand">Vita Longa<small>.me</small></h1><p class="tag">An honest diary of living longer and living well.</p><nav class="nav" aria-label="Explore Vita Longa"><button data-open="quit">Quit Today. Thank Me Later.</button><button data-open="cutting-edge">Cutting Edge</button><button data-open="old-school">Old School View</button><button data-open="lab">The Old Mechanic's Laboratory</button><button data-open="reflections">Reflections</button><button data-open="diary">The Old Mechanic's Diary</button></nav><p class="personal">I'm not a longevity expert. Just an old engineer trying to figure out how to stay alive, healthy, and curious for a little longer.</p></div></main>
<div id="overlay" class="overlay" aria-hidden="true"><section class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"><div class="panel-header"><span class="eyebrow">Vita Longa · A living journal</span><button class="close" id="close" aria-label="Close section">×</button></div><div id="panelContent"></div></section></div>
<template id="tpl-quit"><h2 id="panelTitle">Quit Today. Thank Me Later.</h2><p class="intro">Sometimes longevity begins with removing something rather than buying another thing.</p><div class="safety"><p><strong>Important:</strong> Suddenly stopping heavy daily alcohol use or benzodiazepines (such as Xanax or Valium) can cause life-threatening withdrawal, including seizures. Talk to a medical professional before stopping either if dependent. If severe symptoms occur, seek emergency care.</p></div><div class="tool"><h3>Your private quit counter</h3><p>Choose what you are changing. Your details stay in this browser, not on a server.</p><div class="field"><label>Habit<select id="habit"><option value="alcohol">Alcohol</option><option value="tobacco">Tobacco</option><option value="television">Television / screens</option><option value="other">Other habit</option></select></label><label>Start date<input type="date" id="quitDate"></label><label>Typical spending per day ($)<input id="spend" type="number" min="0" max="100000" step="0.01" value="0"></label></div><div class="button-row"><button class="action" id="saveQuit">Save on this device</button><button class="action alt" id="clearQuit">Clear</button></div><p id="quitResult" aria-live="polite" class="muted"></p></div><div class="tool"><h3>When an urge arrives</h3><p>Cravings rise and fall. Let's get through this one together.</p><p>Breathe gently and comfortably. You don't need to hold your breath or force a rhythm.</p><div class="button-row"><button class="action" id="breathe">Start gentle breathing guide</button><button class="action alt" id="stillHere">Still here</button></div><p id="breathLabel" aria-live="polite" class="metric">One moment at a time</p></div><h3>Real help</h3><p>In the U.S., <a href="tel:18007848669">1-800-QUIT-NOW</a> connects callers with free tobacco cessation support. For alcohol or benzodiazepine dependence, talk with a clinician about a safe plan.</p><p class="note">These tools support reflection and habit tracking. They are not medical treatment.</p></template>
<template id="tpl-cutting-edge"><h2 id="panelTitle">Cutting Edge</h2><p class="intro">What is actually happening in longevity research—and how confident should we be?</p><h3>Red light and near-infrared therapy</h3><span class="research-tag">Promising for selected outcomes</span><span class="date">Last reviewed: November 18, 2026</span><p>Photobiomodulation uses red or near-infrared light to affect biological tissue. Studies suggest benefits in some defined clinical settings, but treatment protocols differ enormously. Results for one condition do not establish results for another.</p><p>A 2025 umbrella review assessed 35 health endpoints and found <strong>no outcome with high-certainty evidence</strong>. A more recent 2026 umbrella review also highlighted substantial differences between studies and limitations in comparing outcomes.</p><p><strong>What remains unproven:</strong> that home light panels slow biological aging, prevent disease broadly, or extend human lifespan.</p><p><strong>Safety:</strong> Follow device-specific eye-protection instructions; avoid staring into intense lights. Consult a clinician about medical applications and photosensitivity concerns. FDA clearance for a particular indication does not establish an anti-aging benefit.</p><h3>Sources</h3><ol class="source-list"><li><a target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/40770824/">2025 umbrella review of randomized trials</a></li><li><a target="_blank" rel="noopener" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13672599/">2026 umbrella review across clinical conditions</a></li><li><a target="_blank" rel="noopener" href="https://www.aad.org/public/cosmetic/safety/red-light-therapy">American Academy of Dermatology: at-home red light therapy</a></li></ol><h3>Corrections & changes</h3><p class="note">No corrections recorded yet. New evidence will be documented here, not silently substituted.</p><hr class="rule"><h3>On the research bench</h3><p><strong>40 Hz stimulation:</strong> experimental and not established to extend life or improve cognition in healthy people. We will not offer flashing-light tools.</p><p><strong>Vibration:</strong> studied for balance and strength in some populations; not a substitute for exercise.</p><p><strong>Meditation and gentle breathing:</strong> supported for some stress-related outcomes, not demonstrated as lifespan-extending treatments.</p><p class="note">Evidence labels describe the specific claim, not an entire technology.</p></template>
<template id="tpl-old-school"><h2 id="panelTitle">Old School View</h2><p class="intro">Good questions are often older than modern technology.</p><h3>Seneca and the use of time</h3><p class="quote">“Life is long, if you know how to use it.”</p><p>Seneca's <em>On the Shortness of Life</em> asks what we do with our available years. A longer life is not automatically a fuller one.</p><h3>The Fourth Way</h3><p>Gurdjieff's self-remembering practice invites attention to automatic behavior in ordinary life. Here it is treated as a philosophical practice, not a medical intervention.</p><h3>Daoist perspective</h3><p>Moderation, flexibility, and knowing when not to force things offer useful questions to carry into later life.</p><p class="note">Historical ideas can be useful without being scientific evidence of longevity benefit.</p></template>
<template id="tpl-lab"><h2 id="panelTitle">The Old Mechanic's Laboratory</h2><p class="intro">Old instruments. New questions. Nothing here is a proven anti-aging treatment.</p><div class="tool"><h3>Gentle breathing guide</h3><p>Try a calm rhythm if comfortable. Slow down or stop if dizzy or short of breath. Never force breath holds.</p><div class="button-row"><button class="action" id="labBreathe">Start / stop</button></div><p class="metric" id="labBreatheLabel" aria-live="polite">Ready</p></div><h3>Instruments from the workshop</h3><p><strong>Cymatic Vibes</strong> — sound and frequency exploration. A 40 Hz tone is not equivalent to a validated medical therapy.</p><p><strong>Cut the Thread</strong> — attention and self-remembering exercises.</p><p><strong>Time in Cubes</strong> — a quiet way to notice where the hours go.</p><p><strong>AxoField & AxoFace</strong> — exploratory perception and sensory experiences; no medical claims.</p><h3>A simple functional check</h3><p>The 30-second chair stand is sometimes used to assess lower-body function. If physically able and safe to do so, record how many times you can rise from a stable chair in 30 seconds without rushing. Consider asking a healthcare professional if it is appropriate for you, particularly if you have fall risk or mobility issues.</p><p class="note">No flashing lights, no diagnoses, no personal health data transmitted.</p></template>
<template id="tpl-reflections"><h2 id="panelTitle">Reflections</h2><p class="intro">A little more attention to the years already here.</p><h3>Morning reflections</h3><p>Not every day has to bring a breakthrough. Sometimes the useful observation is simple: a good night's sleep, a walk, a finished repair, an idea worth exploring.</p><h3>The creative mind</h3><p>Work, invention, study and creative projects can give the day direction. AI can help people build things they once thought were beyond their technical reach—but it is a tool, not a substitute for purpose or human connection.</p><h3>The long view</h3><p>What do I want to be able to do at 85? Carry groceries upstairs, get off the floor, repair something, learn something new, and enjoy the people around me. Those questions matter more than a flashy age number.</p></template>
<template id="tpl-diary"><h2 id="panelTitle">The Old Mechanic's Diary</h2><p class="intro">Personal experience, not advice.</p><p class="eyebrow">Opening note · November 2026</p><p class="quote">I'm not a longevity expert. Just an old engineer trying to figure out how to stay alive, healthy, and curious for a little longer.</p><p>I've spent much of my life solving practical problems. The older I get, the more interesting the problem of living well becomes. Some ideas come from research. Some come from old books. Some come from experiments, and some come from getting things wrong.</p><p>This is a place to document the process—not to sell a cure or pretend that one person's results prove anything. I'll share what I try, what changes, and what doesn't. The negative results belong here too.</p><p><em>Editorial opening draft, to be reviewed in the author's own voice before publication.</em></p><h3>The Junk Drawer</h3><p>Experiments that didn't work, false starts, and opinions revised after new evidence. Nothing needs to disappear just because it failed.</p><h3>Reader conversation</h3><p>Comments are planned for the next phase, with moderation and privacy safeguards. No account or medical details are requested on this first build.</p></template>
<script>
(()=>{'use strict';const overlay=document.getElementById('overlay'),content=document.getElementById('panelContent'),panel=overlay.querySelector('.panel');let previousFocus=null,breathTimer=null,labTimer=null;const known=new Set(['quit','cutting-edge','old-school','lab','reflections','diary']);function stopTimers(){clearInterval(breathTimer);clearInterval(labTimer);breathTimer=null;labTimer=null}function show(id){if(!known.has(id)){hide(false);return}stopTimers();previousFocus=document.activeElement;const tpl=document.getElementById('tpl-'+id);content.replaceChildren(tpl.content.cloneNode(true));overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';panel.scrollTop=0;document.getElementById('close').focus();if(id==='quit')initQuit();if(id==='lab')initLab()}function hide(updateHash=true){stopTimers();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';if(updateHash&&location.hash){history.pushState(null,'',location.pathname+location.search)}if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}function sync(){const h=decodeURIComponent(location.hash.replace(/^#/,''));if(known.has(h)){if(!overlay.classList.contains('open')||content.dataset.id!==h){show(h);content.dataset.id=h}}else if(overlay.classList.contains('open'))hide(false)}document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.open;if(location.hash==='#'+id)show(id);else location.hash=id}));document.getElementById('close').addEventListener('click',()=>{if(history.state?.vitaPanel){history.back()}else hide()});overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))hide();if(e.key==='Tab'&&overlay.classList.contains('open')){const items=[...panel.querySelectorAll('button,input,select,a[href]')].filter(el=>!el.disabled);if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('hashchange',sync);window.addEventListener('popstate',sync);sync();function dateString(d){return d.toISOString().slice(0,10)}function initQuit(){const habit=document.getElementById('habit'),date=document.getElementById('quitDate'),spend=document.getElementById('spend'),result=document.getElementById('quitResult');date.value=dateString(new Date());let saved;try{saved=JSON.parse(localStorage.getItem('vita-quit-v1')||'null')}catch{}if(saved){habit.value=saved.habit||'alcohol';date.value=saved.date||date.value;spend.value=saved.spend??0}function render(){if(!saved){result.textContent='Nothing saved yet.';return}const start=new Date(saved.date+'T00:00:00');const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const days=Math.floor((today-start)/86400000);if(!Number.isFinite(days)||days<0){result.textContent='Choose today or an earlier date.';return}const money=days*Number(saved.spend||0);result.innerHTML='<span class="metric">'+days+' <small>days</small></span> · <span class="metric">$'+money.toLocaleString(undefined,{maximumFractionDigits:2})+' <small>estimated not spent</small></span>'}document.getElementById('saveQuit').onclick=()=>{if(!date.value||Number(spend.value)<0)return;saved={habit:habit.value,date:date.value,spend:Math.min(100000,Number(spend.value)||0)};try{localStorage.setItem('vita-quit-v1',JSON.stringify(saved))}catch{}render()};document.getElementById('clearQuit').onclick=()=>{try{localStorage.removeItem('vita-quit-v1')}catch{}saved=null;render()};render();document.getElementById('stillHere').onclick=()=>{document.getElementById('breathLabel').textContent='Still here. One moment at a time.'};document.getElementById('breathe').onclick=()=>{clearInterval(breathTimer);const label=document.getElementById('breathLabel');let tick=0;const update=()=>{label.textContent=(tick%10<4?'Breathe in gently':'Breathe out gently');tick++};update();breathTimer=setInterval(update,1000)}}function initLab(){const label=document.getElementById('labBreatheLabel'),b=document.getElementById('labBreathe');b.onclick=()=>{if(labTimer){clearInterval(labTimer);labTimer=null;label.textContent='Paused';return}let t=0;const update=()=>{label.textContent=t%10<4?'Inhale gently':'Exhale gently';t++};update();labTimer=setInterval(update,1000)}}})();
</script>
